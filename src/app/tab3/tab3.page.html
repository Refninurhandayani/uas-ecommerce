<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Profil Pemilik</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <!-- Card Identitas Mahasiswa -->
  <ion-card color="primary" class="ion-padding-vertical">
    <ion-avatar style="margin: 10px auto; width: 90px; height: 90px;">
      <img alt="Avatar Pemilik" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
    </ion-avatar>
    <ion-card-header>
      <!-- SILAKAN GANTI DENGAN NAMA & NIM ANDA SENDIRI -->
      <ion-card-title style="color: white; font-weight: bold;">Refni Nurhandayani</ion-card-title>
      <ion-card-subtitle style="color: #f4f5f8; font-size: 14px;">NIM: 2355201041</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content style="color: white; font-size: 15px;">
      Teknik Informatika <br>
      Fakultas Ilmu Komputer <br>
      <b>Universitas Lancang Kuning</b>
    </ion-card-content>
  </ion-card>

  <!-- Detail List Informasi Toko -->
  <ion-list lines="inset" style="text-align: left;">
    <ion-item>
      <ion-icon name="mail-outline" slot="start" color="secondary"></ion-icon>
      <ion-label>
        <h3>Email Kampus</h3>
        <p>refni.nurhandayani@unilak.ac.id</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="call-outline" slot="start" color="success"></ion-icon>
      <ion-label>
        <h3>Kontak Owner</h3>
        <p>+62 895-6309-64746</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="storefront-outline" slot="start" color="warning"></ion-icon>
      <ion-label>
        <h3>Nama Toko</h3>
        <p>myref Digital E-Store</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-button color="danger" fill="clear">
      <ion-icon name="log-out-outline" slot="start"></ion-icon> Keluar Aplikasi
    </ion-button>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar color="light">
    <p style="text-align: center; margin: 5px 0; font-size: 12px;">Sistem Informasi Kontrol Akun Pemilik</p>
  </ion-toolbar>
</ion-footer>
